<div class="form-container">
    <h2>Formulario de Registro</h2>
    <form (ngSubmit)="registerPerson()" #personForm="ngForm" >
        <div class="form-group">
            <div class="form-field">
                <label for="firstName">Nombre:</label>
                <input type="text" [(ngModel)]="newRegister.firstName" id="firstName" name="firstName" ngModel required>
            </div>
           <div class="form-field">
                <label for="lastName">Apellido:</label>
                <input type="text" [(ngModel)]="newRegister.surName" id="lastName" name="lastName" required>
           </div>
        </div>
        <div class="form-group">
            <div class="form-field">
                <label for="dni">DNI:</label>
                <input type="text"[(ngModel)]="newRegister.dni" id="dni" name="dni" ngModel required>
            </div>
            <div class="form-field">
                <label for="phone">Celular:</label>
                <input type="text" [(ngModel)]="newRegister.phone" id="phone" name="phone" ngModel>
            </div>
        </div>
        <div class="form-group">
            <div class="form-field">
                <label for="email">Email:</label>
                <input type="email" [(ngModel)]="newRegister.email" id="email" name="email" ngModel required>
            </div>
        </div>
        <div class="form-group">
            <div class="form-field">
                <label for="date">Fecha de Nacimiento:</label>
                <input type="date" [(ngModel)]="newRegister.birthDate" id="date" name="date" ngModel required>
            </div>
        </div>

        <div class="btn">
            <button type="submit" class="submit">Registrar</button>
            <button type="button" class="button">Cancelar</button>
        </div>
    </form>
</div>
